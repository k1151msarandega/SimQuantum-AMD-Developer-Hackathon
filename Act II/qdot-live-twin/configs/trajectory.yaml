# Scripted device trajectory for the demo run.
# Gradual creep for most of the run, one injected discrete jump partway through.
array_size: [2, 2]          # (rows, cols) of the dot array QArray simulates
n_frames: 2000               # total frames in the demo run
creep:
  vx_range: [-5.0, 5.0]      # volts, linear sweep over the full run
  vy_range: [-5.0, 5.0]
  noise_std: 0.01            # small per-frame jitter on top of the linear creep
jump:
  # Decisive test: earlier attempts (frame 1200, then frame 500) showed the
  # disagreement signal is essentially unchanged regardless of jump
  # location -- same smooth monotonic curve either way. That rules out
  # location as the issue. This test makes the jump magnitude large
  # (roughly half the full sweep range) so that if the pipeline has ANY
  # local sensitivity at all, it cannot miss it. If this still produces no
  # visible response, that's a real finding about the detection approach,
  # not a parameter to keep tuning.
  at_frame: 300
  vx_delta: 4.0
  vy_delta: -4.0
stream_rate_hz:
  start: 5                    # frames/sec at the start of the run
  end: 200                    # ramped up over the run to outpace the serial baseline
