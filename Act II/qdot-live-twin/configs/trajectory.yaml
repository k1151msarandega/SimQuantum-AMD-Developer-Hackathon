# Scripted device trajectory for the demo run.
# Gradual creep for most of the run, one injected discrete jump partway through.
array_size: [2, 2]          # (rows, cols) of the dot array QArray simulates
n_frames: 2000               # total frames in the demo run
creep:
  vx_range: [-5.0, 5.0]      # volts, linear sweep over the full run
  vy_range: [-5.0, 5.0]
  noise_std: 0.01            # small per-frame jitter on top of the linear creep
jump:
  at_frame: 300
  vx_delta: 4.0
  vy_delta: -4.0
stream_rate_hz:
  start: 5                    # frames/sec at the start of the run
  # Raised from 200 to 2000 after confirming (empirically, not guessed) that
  # 200Hz never pushed queue depth past 4 -- nowhere near CHEAP_QUEUE_DEPTH
  # (10) or SKIP_QUEUE_DEPTH (50), so the triage agent never had a real
  # decision to make. This is also more faithful to the original problem:
  # real dispersive/RF reflectometry readout in actual qubit labs runs at
  # MHz rates, so 200Hz was always a conservative stand-in, not a ceiling
  # chosen for realism. Raising it is a correction, not a way to force an
  # outcome -- the thresholds themselves are untouched.
  end: 2000
